name: Deploy dictionary website

# ينشر الموقع على GitHub Pages عند كل Push.
# القاموس نفسه يسحبه المتصفح مباشرة من Google Sheets (مع نسخة محلية في جهاز الزائر)،
# لذلك لا توجد خطوة بناء بيانات هنا إطلاقًا.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests
        run: node --test

      - name: Build the site (sharded search index + static files)
        if: steps.decide.outputs.deploy == 'true'
        run: node scripts/build-site.mjs data/dictionary.json _site

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
