name: Deploy dictionary website

# يعمل عند كل Push إلى main، وكل 30 دقيقة لمزامنة القاموس من Google Sheets، وعند الضغط على Run workflow.
# الموقع لا يحمّل القاموس كاملًا: يُبنى منه فهرس مجزّأ إلى ملفات صغيرة تُنشر على GitHub Pages.
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build dictionary.json from the Google Sheet
        run: python3 scripts/sheet_to_json.py

      - name: Sync public Apps Script pronunciation files
        run: python3 scripts/download_appscript_audio.py

      - name: Enrich dictionary from the Apps Script source
        run: python3 scripts/enrich_appscript_data.py

      - name: Run tests
        run: node --test

      - name: Commit data if it changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data audio-appscript
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Sync dictionary from Google Sheet"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to deploy
        id: decide
        run: |
          # A scheduled run only redeploys when the dictionary actually changed.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.commit.outputs.changed }}" != "true" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the site (sharded search index + static files)
        if: steps.decide.outputs.deploy == 'true'
        run: node scripts/build-site.mjs data/dictionary.json _site

      - uses: actions/configure-pages@v5
        if: steps.decide.outputs.deploy == 'true'
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: steps.decide.outputs.deploy == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
