<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ⲭⲏⲙⲓ — القاموس القبطي</title>
  <meta name="description" content="قاموس قبطي بحيري سريع: ابحث بالقبطية أو العربية أو الإنجليزية أو الفرنسية أو الألمانية، واستمع إلى النطق.">
  <meta name="theme-color" content="#8f2d1e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preload" href="fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css?b=__B__">
  <script>window.__MANIFEST__ = null; /*MANIFEST*/</script>
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <a class="skip" href="#q">انتقل إلى البحث</a>

  <header class="top">
    <a class="brand" href="./" aria-label="ⲭⲏⲙⲓ — القاموس القبطي">
      <span class="brand-mark" aria-hidden="true">ⲭ</span>
      <span class="brand-text"><strong class="cop">ⲭⲏⲙⲓ</strong><span>القاموس القبطي</span></span>
    </a>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="تبديل المظهر" title="تبديل المظهر">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 14.5A8.5 8.5 0 0 1 9.5 3.6 8.5 8.5 0 1 0 20.4 14.5Z"/></svg>
    </button>
  </header>

  <main class="shell" id="app">
    <section class="hero" id="hero">
      <p class="eyebrow">اللغة القبطية · اللهجة البحيرية</p>
      <h1>كلمةٌ تفتح بابًا<br>إلى اللغة القبطية</h1>
      <p class="lead">ابحث بالقبطية أو العربية أو الإنجليزية أو الفرنسية أو الألمانية، وتظهر النتائج أثناء الكتابة.</p>
    </section>

    <div class="searchbar" id="searchbar">
      <form id="form" role="search" autocomplete="off">
        <label class="sr" for="q">ابحث في القاموس</label>
        <svg class="s-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" dir="auto" enterkeyhint="search" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="اكتب كلمة…" aria-controls="list" aria-label="كلمة البحث">
        <button class="clear" id="clear" type="button" aria-label="مسح" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <button class="kb-btn cop" id="kbBtn" type="button" aria-label="لوحة الحروف القبطية" aria-expanded="false" title="لوحة الحروف القبطية">ⲁ</button>
      </form>
      <div class="keypad" id="keypad" hidden></div>
    </div>

    <div class="chips" id="chips" aria-label="اقتراحات"></div>

    <div class="workspace">
      <section class="results" aria-label="نتائج البحث">
        <div class="status" id="status" role="status" aria-live="polite"></div>
        <ul class="list" id="list"></ul>
      </section>

      <aside class="panel" id="panel" aria-label="تفاصيل الكلمة" aria-hidden="true">
        <div class="panel-bar">
          <button class="icon-btn" id="closePanel" type="button" aria-label="إغلاق">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="panel-body" id="panelBody"></div>
      </aside>
    </div>
  </main>

  <div class="backdrop" id="backdrop" hidden></div>
  <footer class="foot"><span class="cop">ⲭⲏⲙⲓ</span><span>القاموس القبطي · <span id="count"></span> مدخل</span></footer>

  <script type="module" src="js/app.js?b=__B__"></script>
</body>
</html>
